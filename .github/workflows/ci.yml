# CI + gated deploy.
#
# Every push / PR runs three checks in parallel: backend tests, front-end
# typecheck/test/build, and the API Docker image build. Only when all three
# pass on a push to main does the deploy job trigger Render (API container)
# and Vercel (Next.js front-end). Both hosts have auto-deploy turned off
# (render.yaml autoDeployTrigger, web/vercel.json) so this is the only path
# to production.
#
# Required repo secrets: RENDER_DEPLOY_HOOK, VERCEL_TOKEN, VERCEL_ORG_ID,
# VERCEL_PROJECT_ID.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run vercel-build

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR image names must be lowercase.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/supapich6511794/trajx-api:latest
            ghcr.io/supapich6511794/trajx-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Quality gate: runs only when every check above passed.
  deploy:
    needs: [backend, frontend, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy API (Render)
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
      - name: Deploy front-end (Vercel)
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm i -g vercel
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
