# Render Blueprint — hosts the Python FastAPI engine as a Docker container
# built from api/Dockerfile (the Next.js front-end is deployed separately on
# Vercel and points here via NEXT_PUBLIC_API_BASE).
#
# Deploy: render.com -> New -> Blueprint -> pick this repo. Auto-deploy is
# off: GitHub Actions (.github/workflows/ci.yml) calls this service's Deploy
# Hook only after tests, front-end build and Docker build all pass. Copy the
# hook URL (Settings -> Deploy Hook) into the RENDER_DEPLOY_HOOK repo secret.
#
# After it goes live, copy the service URL (https://<name>.onrender.com) and
# set it as NEXT_PUBLIC_API_BASE in the Vercel project.

services:
  - type: web
    # Distinct from the older "trajectory-api" service, which deploys a
    # different repo (ATC-Fast-Time-Simulation-Tool-Trajectory-Generator);
    # reusing that name makes the Blueprint try to take it over.
    name: trajx-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      # Set this to the Vercel URL once the front-end is deployed so the
      # browser is allowed to call this API (CORS). *.vercel.app is already
      # allowed by default; set this only for a custom domain.
      - key: WEB_ORIGIN
        sync: false
